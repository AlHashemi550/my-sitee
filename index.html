<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-HASHIMI CYBER SYSTEM</title>
    <style>
        :root { --neon: #00f2ff; --err: #ff0055; --bg: #050505; }
        body { margin:0; background:var(--bg); color:#fff; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
        
        /* البطاقة الرئيسية */
        .card { 
            background:rgba(15,15,15,0.9); border:2px solid var(--neon); padding:40px; 
            border-radius:30px; text-align:center; width:85%; max-width:380px;
            box-shadow: 0 0 30px rgba(0,242,255,0.2); z-index: 1;
        }
        h1 { font-size:2.5rem; margin:0; color:var(--neon); text-shadow:0 0 15px var(--neon); }
        input { 
            width:100%; padding:15px; margin:30px 0; background:transparent; border:none; 
            border-bottom:2px solid var(--neon); color:#fff; font-size:1.8rem; text-align:center; outline:none;
        }
        .btn { 
            width:100%; padding:15px; background:transparent; border:2px solid var(--neon); 
            color:var(--neon); font-weight:bold; cursor:pointer; border-radius:15px; transition:0.3s;
        }
        .btn:hover { background:var(--neon); color:#000; box-shadow:0 0 40px var(--neon); }

        /* شاشات الرسائل (التي لم تكن تفتح) */
        .overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.95); display:none; flex-direction:column;
            justify-content:center; align-items:center; z-index:1000; transition: 0.5s;
        }
        
        /* حركة الكرة الأرضية */
        .earth { font-size:100px; animation:spin 2s linear infinite; }
        @keyframes spin { from{transform:rotateY(0deg);} to{transform:rotateY(360deg);} }

        .msg-content { 
            padding:30px; border-radius:25px; text-align:center; 
            border:2px solid var(--neon); background:#111; max-width:80%;
        }
        .error-border { border-color: var(--err) !important; color: var(--err); }
    </style>
</head>
<body>

    <div class="card">
        <div style="font-size:10px; color:#444;">SECURITY PROTOCOL ACTIVE</div>
        <h1>الهاشمي سوفت</h1>
        <input type="text" id="ticketCode" placeholder="000000" inputmode="numeric">
        <button class="btn" onclick="startVerification()">دخول النظام</button>
        <p style="margin-top:20px; font-size:11px; color:#666;">﴿وَمَنْ يَتَّقِ اللَّهَ يَجْعَلْ لَهُ مَخْرَجًا﴾</p>
    </div>

    <div id="successPage" class="overlay">
        <div class="earth">🌍</div>
        <h2 style="color:var(--neon);">تم الاتصال بنجاح</h2>
        <p>مرحباً بك في شبكة الهاشمي العالمية</p>
    </div>

    <div id="errorPage" class="overlay" onclick="closeError()">
        <div class="msg-content error-border">
            <div style="font-size:50px;">🚫</div>
            <h3>نأسف على المقاطعة</h3>
            <p>الكرت الذي أدخلته خطأ ❌</p>
            <p style="font-size:12px; color:#666;">اضغط في أي مكان للعودة</p>
        </div>
    </div>

    <script>
        function startVerification() {
            var code = document.getElementById('ticketCode').value;
            
            if(code === "225588") {
                // إظهار صفحة النجاح
                document.getElementById('successPage').style.display = 'flex';
                setTimeout(function(){ location.reload(); }, 4000);
            } else {
                // إظهار صفحة الخطأ
                document.getElementById('errorPage').style.display = 'flex';
            }
        }

        function closeError() {
            document.getElementById('errorPage').style.display = 'none';
        }
    </script>
</body>
</html>
