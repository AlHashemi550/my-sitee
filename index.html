<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الراشد للجوالات - المهره</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000; /* خلفية سوداء */
            color: #D4AF37; /* ذهبي ملكي */
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: #000000;
            padding: 40px 20px;
            border: 2px solid #B8860B; /* إطار ذهبي غامق */
            border-radius: 20px;
            max-width: 800px;
            margin: 20px auto;
            box-shadow: 0 0 20px #B8860B;
        }
        h1 { 
            color: #FFD700; /* ذهبي ساطع للعنوان */
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px #000;
        }
        .info { 
            font-size: 1.4em; 
            margin: 30px 0; 
            line-height: 2;
            color: #FFD700; /* ذهبي واضح جداً */
            font-weight: bold;
        }
        .work-images {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        .work-images img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            border: 2px solid #B8860B;
            background: #1a1a1a;
        }
        .btn {
            display: inline-block;
            background-color: #B8860B;
            color: black;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 10px;
            margin-top: 30px;
            font-weight: bold;
            font-size: 1.2em;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #FFD700;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>الراشد للجوالات</h1>
        <div class="info">
            📍 الموقع: المهره - الغيضه - سوق بن خودم<br>
            📞 هاتف: 783234925<br>
            💻 خدماتنا: صيانة وبرمجة - هاتف وكمبيوتر
        </div>

        <h3>صور من أعمالنا</h3>
        <div class="work-images">
            <img src="https://via.placeholder.com/400x300/000000/D4AF37?text=PC+Maintenance" alt="صيانة كمبيوتر">
            <img src="https://via.placeholder.com/400x300/000000/D4AF37?text=Mobile+Repair" alt="صيانة جوالات">
        </div>

        <a href="https://wa.me/967783234925" class="btn">تواصل معنا عبر الواتساب</a>
    </div>
</body>
</html>
