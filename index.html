<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <title>الراشد للجوالات - المهره</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            color: #D4AF37;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background-color: #000000;
            padding: 30px 15px;
            border: 2px solid #B8860B;
            border-radius: 20px;
            max-width: 800px;
            margin: 20px auto;

        /* أزرار التنقل */
        .btn-group { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 25px; }
        
        .btn {
            display: inline-block;
            background-color: #B8860B;
            color: black;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1em;
            width: 80%;
            max-width: 300px;
            transition: 0.3s;
        }
        .btn-secondary {
            background-color: transparent;
            color: #FFD700;
            border: 2px solid #B8860B;
        }
        .btn:hover { background-color: #FFD700; transform: scale(1.05); }
    </style>
</head>
